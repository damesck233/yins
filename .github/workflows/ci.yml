name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Allow the release step to create releases and upload assets.
permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build (module release APK + probe)
        run: ./gradlew :app:assembleRelease :testapp:assembleDebug

      - name: Read version name
        id: ver
        run: echo "name=$(grep -m1 versionName app/build.gradle.kts | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/yins-${{ steps.ver.outputs.name }}.apk"
          cp testapp/build/outputs/apk/debug/testapp-debug.apk "dist/yins-probe-${{ steps.ver.outputs.name }}.apk"

      # Every run (incl. branches / PRs) keeps the APKs as downloadable build artifacts.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yins-apks-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      # Publish a GitHub Release on pushes to main and on version tags.
      # main pushes → v<version>-b<run_number> (unique); tag pushes → the tag itself.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}-b{1}', steps.ver.outputs.name, github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('yins {0} (build {1})', steps.ver.outputs.name, github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: dist/*.apk
